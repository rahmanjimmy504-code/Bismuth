name: Build Bismuth Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Android64 / Geometry Dash 2.2081
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android port configuration
        run: python3 scripts/check_android_port.py

      - name: Build the Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload Android64 package
        uses: actions/upload-artifact@v4
        with:
          name: Bismuth-Android64-GD-2.2081
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
