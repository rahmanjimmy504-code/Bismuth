name: Mobile renderer regression tests

on:
  push:
    branches:
      - "**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "resources/shaders/**"
      - ".github/workflows/render-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa GLES test runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri

      - name: Run source and GLES regressions
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 scripts/check_android_port.py
          python3 tests/run_mobile_atlas_tests.py
          python3 tests/run_mobile_state_tests.py
          python3 tests/run_mobile_lifecycle_tests.py
          python3 tests/run_mobile_upload_tests.py
          python3 tests/run_mobile_geometry_tests.py
          python3 tests/run_mobile_ground_tests.py
          python3 tests/run_mobile_shader_tests.py
